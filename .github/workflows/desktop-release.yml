name: Build & Release Desktop Apps (Linux & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop JAR
        run: ./gradlew :desktop:jar

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/collecter-linux-v2.8.0
          cp desktop/build/libs/Collecter-Desktop-2.8.0.jar dist/collecter-linux-v2.8.0/
          cp desktop/scripts/launch_linux.sh dist/collecter-linux-v2.8.0/
          cp desktop/scripts/collecter.desktop dist/collecter-linux-v2.8.0/
          chmod +x dist/collecter-linux-v2.8.0/launch_linux.sh
          cd dist
          tar -czvf collecter-desktop-linux-x86_64.tar.gz collecter-linux-v2.8.0

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/collecter-macos-v2.8.0
          cp desktop/build/libs/Collecter-Desktop-2.8.0.jar dist/collecter-macos-v2.8.0/
          cp desktop/scripts/launch_macos.command dist/collecter-macos-v2.8.0/
          chmod +x dist/collecter-macos-v2.8.0/launch_macos.command
          cd dist
          zip -r collecter-desktop-macos-universal.zip collecter-macos-v2.8.0

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            desktop/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
